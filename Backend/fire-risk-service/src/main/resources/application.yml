server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: fire-risk-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: fire-risk-service
    description: Weather monitoring and forest fire risk assessments
    owner: Emna

springdoc:
  swagger-ui:
    path: /swagger-ui.html
